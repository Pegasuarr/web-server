<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 2rem; width: 100%; max-width: 420px; }
        h2 { font-size: 20px; font-weight: 500; margin-bottom: 1.5rem; color: #111; }
        .field { margin-bottom: 1rem; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
        input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border .2s; }
        input[type="text"]:focus { border-color: #534AB7; }
        .btn { width: 100%; background: #534AB7; color: #fff; border: none; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { background: #3C3489; }
        .result { margin-top: 1rem; padding: 12px; border-radius: 8px; font-size: 13px; display: none; }
        .result.success { background: #E1F5EE; color: #0F6E56; border: 1px solid #9FE1CB; }
        .result.error   { background: #FCEBEB; color: #A32D2D; border: 1px solid #F7C1C1; }
        .back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #888; text-decoration: none; margin-bottom: 1.2rem; }
        .back:hover { color: #534AB7; }
    </style>
</head>
<body>
<div class="card">
    <a href="/" class="back"><i class="ti ti-arrow-left"></i> Back to home</a>
    <h2>Submit your details</h2>

    <div class="field">
        <label>Name</label>
        <input type="text" id="name" placeholder="John Doe">
    </div>
    <div class="field">
        <label>Address</label>
        <input type="text" id="address" placeholder="123 Main St">
    </div>

    <button class="btn" onclick="submitForm()">
        <i class="ti ti-send"></i> Submit
    </button>

    <div class="result" id="result"></div>
</div>

<script>
    async function submitForm() {
        const name = document.getElementById('name').value.trim();
        const address = document.getElementById('address').value.trim();
        const result = document.getElementById('result');

        result.style.display = 'none';

        try {
            const res = await fetch('/form', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `name=${encodeURIComponent(name)}&address=${encodeURIComponent(address)}`
            });

            const data = await res.json();
            result.style.display = 'block';

            if (data.success) {
                result.className = 'result success';
                result.innerHTML = `<i class="ti ti-check"></i> ${data.message} — <strong>${data.data.name}</strong>, ${data.data.address}`;
            } else {
                result.className = 'result error';
                result.innerHTML = `<i class="ti ti-alert-circle"></i> ${data.message}`;
            }
        } catch (err) {
            result.style.display = 'block';
            result.className = 'result error';
            result.innerHTML = `<i class="ti ti-alert-circle"></i> Something went wrong. Try again.`;
        }
    }
</script>
</body>
</html>
